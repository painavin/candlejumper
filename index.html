<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>Candle Jumper</title>
    <!-- Inline SVG, so the build still ships exactly one binary asset (the font)
         and the console stays free of a favicon 404. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0e14'/%3E%3Crect x='5' y='18' width='4' height='9' fill='%233f6ea8'/%3E%3Crect x='11' y='12' width='4' height='15' fill='%233f6ea8'/%3E%3Crect x='17' y='15' width='4' height='12' fill='%233f6ea8'/%3E%3Crect x='23' y='7' width='4' height='20' fill='%235b8fd0'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0e14;
        color: #e6e6e6;
        font-family:
          ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        /* Touch input is a game control, not a scroll gesture. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #ui {
        position: fixed;
        inset: 0;
        overflow-y: auto;
        /* Menus are the only DOM that takes pointer input; during a run this
           layer is empty and must not swallow game input. */
        pointer-events: none;
      }
      #ui > * {
        pointer-events: auto;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        padding: 24px;
        font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
        opacity: 0.85;
        overflow-y: auto;
      }
      #boot[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="ui"></div>
    <div id="boot">starting…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
